[project]
name = "swissquote-tax-calculator"
version = "0.1.0"
description = "CLI tool to evaluate Swissquote bank transaction CSVs for German tax declarations (Anlage KAP / KAP-INV)"
requires-python = ">=3.14"
dependencies = [
    "configargparse>=1.7",
    "loguru>=0.7.0",
    "markdown>=3.7",
    "polars>=1.16.0",
    "pyarrow>=25.0.0",
    "streamlit>=1.40.0",
    "watchdog>=6.0.0",
    "weasyprint>=63.0",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "taxes"
module-root = "src"

[project.scripts]
swissquote-tax-calculator = "taxes.cli:main"
swissquote-tax-app = "taxes.app:run_app"

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.1.0",
    "types-Markdown>=3.7.0.20240316",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ANN"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
search-path = ["src", "."]
