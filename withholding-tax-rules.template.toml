# Copy this file to withholding-tax-rules.toml.
#
# Default rule logic (no configuration required):
# - ISINs starting with DE are treated as domestic German capital gains tax (max_creditable_rate = 0.0).
# - All other ISIN prefixes default to foreign withholding tax with max_creditable_rate = 0.15.
#
# Use [[country]] entries to override defaults for an entire ISIN prefix (e.g. France or UK),
# and [[security]] entries to override rules for individual securities (e.g. an ETF).
#
# tax_treatment values:
# - domestic: German capital gains tax; max_creditable_rate must be 0.0.
# - foreign: Foreign withholding tax; credit is limited to gross dividend times rate.
#
# instrument values (optional, default "share"):
# - share: Ordinary share dividend reported in Anlage KAP.
# - fund: Investment fund / ETF distribution reported in Anlage KAP-INV.

# German domestic tax default is already built-in:
# [[country]]
# isin_prefix = "DE"
# source_country = "DE"
# tax_treatment = "domestic"
# max_creditable_rate = 0.0

# France has a 12.8% DTA withholding tax rate for individuals:
# [[country]]
# isin_prefix = "FR"
# source_country = "FR"
# tax_treatment = "foreign"
# max_creditable_rate = 0.128

# UK dividends generally have no withholding tax (0% creditable rate):
# [[country]]
# isin_prefix = "GB"
# source_country = "GB"
# tax_treatment = "foreign"
# max_creditable_rate = 0.0

# Example rule override for a specific security (e.g., a US-sourced fund under a Swiss ISIN):
# [[security]]
# isin = "CH0000000000"
# source_country = "US"
# tax_treatment = "foreign"
# max_creditable_rate = 0.15
